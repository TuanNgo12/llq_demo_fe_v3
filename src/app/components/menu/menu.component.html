<aside class="sidebar" [class.sidebar_collapsed]="collapsed">
  <div class="sidebar__logo">
    <tui-icon icon="@tui.layout-grid" />
  </div>

  @for (item of items; track item.label + $index) {
    <button
      type="button"
      class="sidebar__item"
      [class.sidebar__item_active]="item.active"
      [title]="item.label"
    >
      <tui-icon [icon]="item.icon" />
      @if (!collapsed) {
        <span>{{ item.label }}</span>
      }
    </button>
  }

  <button
    type="button"
    class="sidebar__item sidebar__toggle"
    (click)="toggle()"
    [title]="collapsed ? 'Mở rộng' : 'Thu gọn'"
  >
    <tui-icon [icon]="collapsed ? '@tui.panel-left-open' : '@tui.panel-left-close'" />
    @if (!collapsed) {
      <span>Thu gọn</span>
    }
  </button>

  <button type="button" class="sidebar__item sidebar__item_bottom" title="Đăng xuất">
    <tui-icon icon="@tui.log-out" />
    @if (!collapsed) {
      <span>Đăng xuất</span>
    }
  </button>
</aside>
