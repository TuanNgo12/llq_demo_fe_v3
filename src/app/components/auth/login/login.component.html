<div class="login">
    <form class="login__card" [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="login__brand">
            <tui-icon icon="@tui.credit-card" class="login__brand-icon" />
            <span>PAYMENT <b>HUB</b></span>
        </div>

        <h1 tuiTitle class="login__heading">Đăng nhập hệ thống</h1>

        @if (loginError()) {
        <div class="login__error">
            <tui-icon icon="@tui.alert-triangle" />
            {{ loginError() }}
        </div>
        }

        <div class="login__field">
            <label tuiLabel>Tên đăng nhập</label>
            <tui-textfield>
                <input tuiInput formControlName="username" placeholder="Nhập tên đăng nhập" autocomplete="username" />
                <tui-error formControlName="username" [order]="['required']" />
            </tui-textfield>
        </div>

        <div class="login__field">
            <label tuiLabel>Mật khẩu</label>
            <tui-textfield [tuiTextfieldCleaner]="false">
                <input tuiInput [type]="showPassword() ? 'text' : 'password'" formControlName="password"
                    placeholder="Nhập mật khẩu" autocomplete="current-password" />
                <tui-error formControlName="password" [order]="['required']" />
            </tui-textfield>
            <button type="button" class="login__password-toggle"
                [attr.aria-label]="showPassword() ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'" (click)="togglePassword()">
                <tui-icon [icon]="showPassword() ? '@tui.eye-off' : '@tui.eye'" />
            </button>
        </div>

        <button tuiButton type="submit" size="l" class="login__submit" [disabled]="loading()">
            {{ loading() ? 'Đang đăng nhập...' : 'Đăng nhập' }}
        </button>

        <a routerLink="/register" class="login__switch-link">Chưa có tài khoản? Đăng ký</a>
    </form>
</div>
