<div class="register">
    <form class="register__card" [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="register__brand">
            <tui-icon icon="@tui.credit-card" class="register__brand-icon" />
            <span>PAYMENT <b>HUB</b></span>
        </div>

        <h1 tuiTitle class="register__heading">Tạo tài khoản mới</h1>
        <p class="register__subtext">Tài khoản mới mặc định có quyền MAKER (tạo, sửa, gửi duyệt).</p>

        @if (formError()) {
        <div class="register__error">
            <tui-icon icon="@tui.alert-triangle" />
            {{ formError() }}
        </div>
        }

        <div class="register__field">
            <label tuiLabel>Tên đăng nhập</label>
            <tui-textfield>
                <input tuiInput formControlName="username" placeholder="3-50 ký tự" autocomplete="username" />
                <tui-error formControlName="username" [order]="['required', 'minlength', 'maxlength']" />
            </tui-textfield>
        </div>

        <div class="register__field">
            <label tuiLabel>Email</label>
            <tui-textfield>
                <input tuiInput type="email" formControlName="email" placeholder="ten@congty.com"
                    autocomplete="email" />
                <tui-error formControlName="email" [order]="['required', 'email']" />
            </tui-textfield>
        </div>

        <div class="register__field">
            <label tuiLabel>Mật khẩu</label>
            <tui-textfield>
                <input tuiInput [type]="showPassword() ? 'text' : 'password'" formControlName="password"
                    placeholder="Tối thiểu 8 ký tự" autocomplete="new-password" />
                <tui-error formControlName="password" [order]="['required', 'minlength']" />
            </tui-textfield>
            <button type="button" class="register__password-toggle"
                [attr.aria-label]="showPassword() ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'" (click)="togglePassword()">
                <tui-icon [icon]="showPassword() ? '@tui.eye-off' : '@tui.eye'" />
            </button>
        </div>

        <div class="register__field">
            <label tuiLabel>Nhập lại mật khẩu</label>
            <tui-textfield>
                <input tuiInput [type]="showPassword() ? 'text' : 'password'" formControlName="confirmPassword"
                    placeholder="Nhập lại mật khẩu" autocomplete="new-password" />
                <tui-error formControlName="confirmPassword" [order]="['required', 'passwordMismatch']" />
            </tui-textfield>
        </div>

        <button tuiButton type="submit" size="l" class="register__submit" [disabled]="loading()">
            {{ loading() ? 'Đang tạo tài khoản...' : 'Đăng ký' }}
        </button>

        <a routerLink="/login" class="register__switch-link">Đã có tài khoản? Đăng nhập</a>
    </form>
</div>
